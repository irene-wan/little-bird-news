<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="열매를 문 오목눈이">
  <!-- 날아온: 빨간 열매를 문 오목눈이 '자구' -->
  <!-- 뒤로 길게 뻗은 꼬리 -->
  <path d="M22 26.5 L4 17.5 Q1.2 17.6 1.8 20.6 L21 34Z" fill="#1b2924" stroke="#1b2924" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M19 29.4 L5.4 20.4" stroke="#fffdf8" stroke-width="1.3" stroke-linecap="round"/>
  <!-- 발 -->
  <path d="M33 46.5l-1 5M39.5 46.5v5" stroke="#1b2924" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 동그란 몸 -->
  <ellipse cx="36" cy="32" rx="18" ry="16" fill="#fffdf8" stroke="#1b2924" stroke-width="2.6"/>
  <!-- 배의 분홍빛 -->
  <ellipse cx="37" cy="41" rx="10" ry="4" fill="#f6cbd2" opacity=".9"/>
  <!-- 접은 날개 -->
  <path d="M20.5 29.5 Q28.5 26.5 35 33.5 Q30 41.5 22 39 Q19 34.5 20.5 29.5Z" fill="#3a3f47"/>
  <path d="M23.4 29 Q29.4 28.6 33 32.4 Q28 33.4 23.6 31.4Z" fill="#eaa0b0"/>
  <!-- 눈 위 검은 띠 -->
  <path d="M49 26 Q41.5 17.2 28.5 18.6" stroke="#1b2924" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- 눈과 볼 -->
  <circle cx="46" cy="29.6" r="2.7" fill="#1b2924"/>
  <circle cx="47" cy="28.6" r=".95" fill="#fffdf8"/>
  <ellipse cx="48.6" cy="35.4" rx="3" ry="1.9" fill="#f59aaa"/>
  <!-- 부리 -->
  <path d="M53.6 29.8 L58.2 31.6 L53.6 33.6Z" fill="#1b2924"/>
  <!-- 문 열매 -->
  <path d="M57.4 31.8 Q58.6 30.4 59.6 30.6" stroke="#5a3a24" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M59.4 30.8 Q61 26 63.6 27.6 Q62.4 31.4 59.4 30.8Z" fill="#6fb36a"/>
  <circle cx="58.6" cy="36.4" r="4.7" fill="#e8434f" stroke="#1b2924" stroke-width="1.4"/>
  <circle cx="57.2" cy="34.9" r="1.2" fill="#fffdf8" opacity=".9"/>
</svg>
