<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은 새의 소식</title>
<meta name="description" content="나를 아는 작은 새가 나에게 딱 알맞은 소식을 골라 전합니다. 프로필을 적으면 오늘의 소식 세 편을 근거와 함께 가져옵니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* 배치: 한 줄 기둥(최대 640px). 위에 붙는 얇은 띠에 진행 위치와 새의 자리. 색과 글꼴은 목표 시안의 값을 따른다. */
:root {
  --bg: #f8f7f2; --surface: #fffefa; --ink: #1b2924; --muted: #657069; --line: #e6e8e0; --soft: #eff2eb;
  --accent: #f16d4c; --accent-text: #9d3b26; --navy: #1f3b51; --on-navy: #f8f7f2;
  --topic: #2c7d64; --topic-soft: #eaf5ee; --assume: #8a5200; --assume-soft: #fbefd9; --ok: #1f7a4d; --bad: #b3261e;
  --font-display: "Noto Serif KR", "Nanum Myeongjo", Georgia, serif;
  --font-body: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #111a17; --surface: #1c2722; --ink: #eff5ee; --muted: #b0bcb5; --line: #35443b; --soft: #28382f;
  --accent: #ff9374; --accent-text: #ffc1ab; --navy: #24394a; --on-navy: #eff5ee;
  --topic: #8ddcb6; --topic-soft: #203e33; --assume: #f1bf6b; --assume-soft: #3a2e17; --ok: #6fd3a0; --bad: #ff8a80; } }

:root { color-scheme: light dark; }
[data-tone="tech"] { --topic: light-dark(#3b50c4, #9aa9ff); --topic-soft: light-dark(#e6eafb, #252e55); }
[data-tone="work"] { --topic: light-dark(#8a4fb0, #d2a8f0); --topic-soft: light-dark(#f3e9f9, #3a2a48); }
[data-tone="money"] { --topic: light-dark(#a35a00, #f1bf6b); --topic-soft: light-dark(#fbefd9, #3a2e17); }
[data-tone="home"] { --topic: light-dark(#c2452d, #ff9d86); --topic-soft: light-dark(#fdebe6, #46261f); }
[data-tone="world"] { --topic: light-dark(#1f6f8b, #8fd3ea); --topic-soft: light-dark(#e4f3f8, #1d3a44); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: clip; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, summary:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
h1, h2 { text-wrap: balance; }
a { color: inherit; }

.bar { position: sticky; top: 0; z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar-in, .wrap { max-width: 640px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { min-height: 56px; display: flex; align-items: center; gap: 12px; }
.bar-title { flex: 1; min-width: 0; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-title strong { display: block; color: var(--ink); font-size: 0.95rem; }
.bar-btn { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 0.8rem; font-weight: 700; }
.wrap { padding-block: 24px 56px; }
#view { display: flex; flex-direction: column; gap: 24px; }

/* 새의 자리 */
.slot { display: grid; place-items: center; flex: none; }
.slot[data-size="lg"] { width: 168px; height: 168px; }
.slot[data-size="md"] { width: 88px; height: 88px; }
.slot[data-size="sm"] { width: 44px; height: 44px; }
.bird-btn { position: relative; width: 100%; height: 100%; padding: 0; border: 0; background: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; }
.bird-btn canvas { position: absolute; display: block; }
.bird-btn svg { width: 100%; height: 100%; display: block; color: var(--accent); }
@keyframes fly-in { from { transform: translate(38vw, -28vh) scale(0.45) rotate(16deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes hand-over { from { transform: translateX(-14px) rotate(-6deg); } to { transform: none; } }
@keyframes pop { from { transform: scale(0.96); opacity: 0.4; } to { transform: none; opacity: 1; } }
.bird-btn.fly-in { animation: fly-in 900ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.bird-btn.hand-over { animation: hand-over 420ms ease-out both; }
.pop { animation: pop 320ms ease-out both; }
@media (prefers-reduced-motion: reduce) { .bird-btn.fly-in, .bird-btn.hand-over, .pop { animation: none; } }

/* 말풍선: 새의 말은 본문과 구분한다 */
.say { display: flex; gap: 12px; align-items: flex-start; }
.bubble { flex: 1; min-width: 0; background: var(--topic-soft); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.bubble-label { font-size: 0.75rem; font-weight: 800; color: var(--topic); }
.bubble p { font-size: 0.95rem; }
.basis { font-size: 0.75rem; color: var(--muted); line-height: 1.55; border-top: 1px solid color-mix(in srgb, var(--topic) 25%, transparent); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.basis b { color: var(--ink); font-weight: 700; }
.say-line .bubble { background: var(--soft); padding: 10px 14px; }

/* 도착, 기다림, 마무리 */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-block: 8px; }
.stage h1 { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.35; letter-spacing: -0.03em; }
.stage p { color: var(--muted); font-size: 0.9rem; max-width: 34em; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; align-items: start; }
.card > * { grid-column: 2; }
.card .ico { grid-column: 1; grid-row: 1 / span 4; }
.ico { width: 56px; height: 56px; border-radius: 16px; background: var(--topic-soft); display: grid; place-items: center; font-size: 1.7rem; line-height: 1; }
.tag { align-self: flex-start; justify-self: start; font-size: 0.72rem; font-weight: 800; color: var(--topic); background: var(--topic-soft); border-radius: 999px; padding: 2px 10px; }
.head { display: flex; align-items: center; gap: 12px; }
.progress { display: flex; gap: 6px; }
.progress i { width: 28px; height: 5px; border-radius: 3px; background: var(--line); }
.progress i[data-on="1"] { background: var(--topic); }
.card .topic { font-size: 0.75rem; font-weight: 800; color: var(--topic); display: flex; justify-content: space-between; gap: 8px; }
.card h3 { font-size: 1.05rem; line-height: 1.45; letter-spacing: -0.02em; }
.card .line { font-size: 0.85rem; color: var(--muted); }
.card .num { font-size: 1.5rem; font-weight: 900; color: var(--topic); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.card[data-read="1"] .topic span:last-child::after { content: " · 읽음"; }
.primary { min-height: 52px; border: 0; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 1rem; padding: 0 20px; }
.primary:disabled { opacity: 0.5; cursor: default; }
.quiet { min-height: 44px; border: 0; background: none; color: var(--muted); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 3px; }
.steps { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--muted); text-align: left; }
.steps li[data-on="1"] { color: var(--ink); font-weight: 700; }
.steps li::before { content: "· "; }
.steps li[data-done="1"]::before { content: "✓ "; color: var(--topic); }

/* 프로필 입력 */
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; font-size: 0.95rem; }
.field label small { font-weight: 500; color: var(--muted); font-size: 0.78rem; margin-left: 6px; }
.field textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; font-size: 1rem; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 0.85rem; font-weight: 700; }
.note { font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
.error { background: var(--assume-soft); color: var(--assume); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; font-weight: 700; }

/* 소식 */
.meta { font-size: 0.75rem; font-weight: 800; color: var(--topic); display: flex; gap: 8px; flex-wrap: wrap; }
.meta span + span { color: var(--muted); font-weight: 600; }
.hook { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.3; letter-spacing: -0.04em; }
.answer { font-size: 1rem; color: var(--muted); }
.hero-num { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px; }
.hero-num > div:last-child { display: flex; flex-direction: column; min-width: 0; }
.hero-num { background: var(--topic-soft); border-color: transparent; }
.hero-num strong { font-size: 2.3rem; line-height: 1.15; font-weight: 900; letter-spacing: -0.05em; color: var(--topic); font-variant-numeric: tabular-nums; }
.hero-num span { font-size: 0.8rem; color: var(--muted); }
.donut { --p: 18; width: 72px; height: 72px; border-radius: 50%; flex: none; background: conic-gradient(var(--topic) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; }
.donut::after { content: ""; width: 48px; height: 48px; border-radius: 50%; background: var(--topic-soft); }
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.key { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 0.8rem; font-weight: 700; line-height: 1.5; }
.key b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--topic); color: var(--bg); font-size: 0.8rem; margin-bottom: 8px; }
.w-fallback .fb-list, .w-fallback .fb-card:nth-child(n+5) { display: none; }
.section-h { font-size: 1.15rem; letter-spacing: -0.03em; }
.quiz { background: var(--navy); color: var(--on-navy); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.quiz small { font-size: 0.72rem; font-weight: 800; opacity: 0.75; letter-spacing: 0.04em; }
.quiz h3 { font-size: 1.05rem; line-height: 1.5; }
.quiz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quiz-opts button { min-height: 52px; border: 1px solid color-mix(in srgb, var(--on-navy) 30%, transparent); border-radius: 12px; background: transparent; color: inherit; font-weight: 800; font-size: 0.88rem; padding: 8px 10px; line-height: 1.4; }
.quiz-opts button[aria-pressed="true"] { background: var(--on-navy); color: var(--navy); }
.quiz-fb { font-size: 0.85rem; line-height: 1.6; background: color-mix(in srgb, var(--on-navy) 12%, transparent); border-radius: 10px; padding: 10px 12px; }
details.box { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px; }
details.box summary { font-weight: 800; font-size: 0.95rem; cursor: pointer; min-height: 28px; }
details.box > div { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; }
.deep p { font-size: 1rem; line-height: 1.9; max-width: 65ch; }
.deep h3 { font-size: 1.05rem; letter-spacing: -0.02em; }
.kind { align-self: flex-start; font-size: 0.7rem; font-weight: 800; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.kind-ai { border-style: dashed; }
.srcs { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.82rem; }
.srcs span { color: var(--muted); display: block; font-size: 0.75rem; }
.decisions { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 0.82rem; }
.decisions li { display: flex; flex-direction: column; gap: 2px; }
.decisions li[data-sel="1"] b::before { content: "✓ "; color: var(--topic); }
.decisions span { color: var(--muted); font-size: 0.75rem; }
.credit { font-size: 0.72rem; color: var(--muted); line-height: 1.6; text-align: center; margin-top: 32px; }

/* 조작형 설명 (비교, 시뮬레이션, 과정)과 요약 카드 */
.w { --accent: var(--topic); --on-accent: var(--bg); --accent-soft: var(--topic-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; touch-action: pan-y; }
.w-head { display: flex; flex-direction: column; gap: 4px; }
.w h3 { font-size: 1.05rem; font-weight: 800; line-height: 1.4; }
.w h4 { font-size: 0.95rem; font-weight: 700; }
.w-guide { font-size: 0.9rem; color: var(--muted); line-height: 1.55; }
.w-note, .w-src { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
.w-src { border-top: 1px solid var(--line); padding-top: 10px; }
.chip { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; line-height: 1.5; white-space: nowrap; }
.chip-fact { background: var(--accent-soft); color: var(--accent); }
.chip-assumed { background: var(--assume-soft); color: var(--assume); outline: 1px dashed var(--assume); }
.chip-custom { background: transparent; color: var(--muted); outline: 1px solid var(--line); }
.diff { font-size: 0.85rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.diff-same { color: var(--muted); font-weight: 500; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button, .mark { min-height: 44px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 500; }
.seg button[aria-pressed="true"], .mark[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.cmp-rows { display: flex; flex-direction: column; gap: 18px; }
.cmp-metric { display: flex; flex-direction: column; gap: 6px; }
.cmp-metric-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bar-row { display: grid; grid-template-columns: minmax(3.2em, auto) 1fr auto; align-items: center; gap: 8px; font-size: 0.85rem; }
.bar-label { color: var(--muted); }
.bar-track { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; min-width: 0; }
.bar-fill { display: block; height: 100%; border-radius: 7px; transition: width 0.25s ease; }
.bar-base { background: var(--muted); opacity: 0.55; }
.bar-sel { background: var(--accent); }
.bar-value { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 4.5em; text-align: right; }
.sim-out { background: var(--bg); border-radius: 10px; padding: 14px; }
.sim-out-item { display: flex; flex-direction: column; gap: 2px; }
.sim-out-label { font-size: 0.85rem; color: var(--muted); }
.sim-out-value { font-size: 2rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sim-out-value small { font-size: 1rem; font-weight: 500; }
.sim-controls { display: flex; flex-direction: column; gap: 20px; }
.sim-input { display: flex; flex-direction: column; gap: 6px; }
.sim-input-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sim-input-head label { font-weight: 700; font-size: 0.95rem; }
.sim-input-val { display: flex; align-items: center; gap: 8px; }
.sim-value { font-variant-numeric: tabular-nums; font-weight: 700; }
input[type="range"] { width: 100%; height: 44px; margin: 0; accent-color: var(--topic); touch-action: pan-y; }
.marks { display: flex; gap: 8px; flex-wrap: wrap; }
.mark { font-size: 0.85rem; padding: 6px 14px; }
.dots { list-style: none; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; font-variant-numeric: tabular-nums; }
.dot-done { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
.dot-now { border: 2px solid var(--accent); color: var(--accent); }
.dot[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.proc-card { background: var(--bg); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 9.5em; }
.proc-pos { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.proc-state { font-weight: 700; }
.proc-now { color: var(--accent); }
.proc-body { font-size: 0.95rem; line-height: 1.65; }
.proc-figure { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.proc-figure strong { color: var(--ink); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.proc-nav { display: flex; gap: 8px; }
.nav { flex: 1; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 700; }
.nav-next { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.nav:disabled { opacity: 0.35; cursor: default; }
.fb-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.fb-card { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fb-card strong { font-size: 1.3rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.fb-card span { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
.fb-list { padding-left: 1.2em; font-size: 0.9rem; display: flex; flex-direction: column; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .bar-fill { transition: none; } }
@media (max-width: 380px) { .hook { font-size: 1.6rem; } .keys { grid-template-columns: 1fr; } .quiz-opts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="bar-title"><span id="bar-date">나를 아는 작은 새</span><strong id="bar-pos">작은 새의 소식</strong></div>
  <div class="slot" data-size="sm" id="slot-dock"></div>
  <button class="bar-btn" id="profile-btn" type="button" hidden>프로필 바꾸기</button>
</div></header>

<main class="wrap">
  <div id="view"></div>
  <p class="credit">소식은 언론 보도를 바탕으로 정리했어요. 원문은 각 소식의 출처에서 볼 수 있어요.<br>새 그림: "Bird" by JcToon (Rive, CC BY)</p>
</main>

<script src="validate.js"></script>
<script src="components.js"></script>
<script>
(function () {
  "use strict";
  var CFG = {
    runtime: "vendor/rive.js", wasm: "vendor/rive.wasm", asset: "bird.riv",
    stateMachine: "State Machine 1", input: "Pressed",
    // 그림 파일의 대지(500×500)에서 새는 아래쪽 4분의 1만 차지한다. 자리 크기별로 보여 줄 중심과 배율.
    crop: { lg: { cx: 0.46, cy: 0.5, zoom: 1.5 }, md: { cx: 0.46, cy: 0.5, zoom: 1.5 }, sm: { cx: 0.47, cy: 0.62, zoom: 2.2 } },
    timeoutMs: 9000
  };
  var FALLBACK_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="52" cy="58" rx="30" ry="26" fill="currentColor"/><circle cx="36" cy="40" r="17" fill="currentColor"/><path d="M19 40 6 45l14 4z" fill="currentColor"/><path d="M78 52c12-6 16-16 15-24-9 3-17 9-21 17z" fill="currentColor"/><circle cx="32" cy="37" r="3.2" fill="#fff"/><path d="M44 84v9m14-9v9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
  var $ = function (id) { return document.getElementById(id); };

    onBird = function () { Bird.setQuiet(false); Bird.place(slot); Bird.react(); };
    onBird();
  }

  $("profile-btn").addEventListener("click", function () { intro(); });
  window.__demo = { story: function (i) { story(i); }, arrival: arrival, closing: closing, state: function () { return at; } }; // 개발 확인용
  // 시작: 글을 먼저 그리고, 새는 그 뒤에 불러온다
  intro();
  var boot = function () { Bird.init().then(function () { onBird(); }); };
  if ("requestIdleCallback" in window) requestIdleCallback(boot, { timeout: 600 }); else setTimeout(boot, 50);
})();
</script>
