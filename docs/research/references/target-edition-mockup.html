:"개"}},{"title":"2단계: 원인 유전자 변이 포착","body":"별도의 재학습 없이도 새로운 세포 유형과 생물학적 상태를 예측하며, 원인 유전자 변이를 포착하는 비율을 30%까지 높였다.","facts":["F4","F5"],"figure":{"label":"원인 변이 포착 비율","value":{"v":30,"fact":"F4"},"unit":"%"}},{"title":"3단계: 미학습 상태 구분 및 목적별 활용","body":"학습 과정에서 접하지 않은 코로나19 mRNA 백신 데이터에서도 활성화된 T세포와 휴지 상태 T세포를 구분했다. 약 90억 개의 변이를 폭넓게 볼 때는 기존 모델을, 특정 세포의 질병 원인 추적이나 신약 표적 발굴에는 알파게놈 2를 활용한다.","facts":["F6","F8"],"figure":{"label":"기존 모델의 광범위 분석 대상","value":{"v":9000000000,"fact":"F8"},"unit":"개"}},{"title":"4단계: 다종 데이터 학습과 가상 세포 전망","body":"딥마인드는 향후 여러 종의 데이터를 함께 학습하는 방안을 검토하고 있으며, 장기적으로 가상 세포 개발에도 활용될 수 있다고 내다봤다.","facts":["F11"]}]}},"sources":[{"source":"디지털투데이 (DigitalToday)","title":"구글 딥마인드, 질병 원인 찾는 AI '알파게놈 2' 공개","url":"https://www.digitaltoday.co.kr/news/articleView.html?idxno=714846","dateTime":"2026-11-12T01:39:42Z"},{"source":"한국일보","title":"같은 DNA 변이도 세포 따라 다르다...구글 AI, 질병 원인 정밀 추적-경제ㅣ한국일보","url":"https://www.hankookilbo.com/news/article/A2026111209140000804","dateTime":"2026-11-12T07:33:47Z"},{"source":"koreatimes.com","title":"구글, DNA분석 '알파게놈2' 공개...세포별 변이 정밀 예측","url":"https://www.koreatimes.com/article/11631276","dateTime":"2026-11-12T06:01:38Z"},{"source":"Wow TV","title":"구글, DNA분석 '알파게놈2' 공개...세포별 변이 정밀 예측","url":"https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=AKR20261112013300091","dateTime":"2026-11-11T22:14:30Z"}]},{"cid":"C179","kind":"personal","topic":"건강","asOf":"2026-11-13","story":{"title":"고지방 식단의 흔적, 식단을 바꿔도 장 줄기세포에 남는다","lede":{"text":"미국 애리조나주립대 연구팀이 고지방 식단이 생쥐의 장 줄기세포에 장기적인 흔적을 남겨, 식단을 정상화했다가 다시 고지방 식단에 노출될 경우 종양 성장을 촉진할 수 있다는 연구 결과를 발표했다.","facts":["F1","F7","F8"],"verdict":"ok"},"why":{"text":"(추천 이유 문장. 창업자의 실제 프로필에서 나온 내용이라 저장소 사본에서는 가렸다.)","links":["L1"],"verdict":"ok"},"blocks":[{"kind":"fact","heading":"고지방 식단이 남긴 장 줄기세포의 기억","sentences":[{"text":"애리조나주립대 미야코 마나 교수팀은 생후 8주부터 24주 동안 생쥐에게 일반 사료와 고지방 사료를 먹인 뒤 소장의 장 줄기세포 변화를 살폈다.","facts":["F1","F2"],"verdict":"ok"},{"text":"고지방 식단을 먹은 생쥐는 저지방 식단 집단보다 체중이 더 많이 늘었고 장 줄기세포 수와 세포 증식  장 줄기세포의 기능적 특성과 종양 병변 크기가 대조군 수준에 가까워졌다.","value":4,"unit":"주"},{"id":"F6","text":"고지방 식단으로 접근성이 증가했던 염색질 영역 중 약 18%는 일반 사료로 바꾼 지 4주가 지난 뒤에도 접근성이 증가한 상태를 유지했다.","value":18,"unit":"%"},{"id":"F7","text":"고지방-저지방-고지방으로 식단을 변경한 생쥐의 장 줄기세포는 처음 고지방 식단에 노출된 생쥐보다 오가노이드를 더 잘 형성하고 장 선종도 더 크게 자랐다."},{"id":"F8","text":"연구팀은 이 연구가 고지방 식단이 장 줄기세포에 장기간 지속되는 변화를 남겨 유전적 돌연변이와 함께 작용해 종양 발생 가능성을 높일 수 있음을 시사한다고 말했다."},{"id":"F9","text":"연구팀은 이 연구가 생쥐의 소장 줄기세포를 대상으로 한 실험이므로 결과를 사람에게 그대로 적용하거나 고지방 식단이 사람의 대장암을 일으킨다고 단정할 수는 없다고 덧붙였다."}],"source":{"label":"Wow TV 보도","asOf":"2026-11-13"},"spec":{"title":"식단을 바꿨는데도 왜 종양이 더 잘 자랄까","guide":"단계를 하나씩 넘겨 보세요. 고지방 식단 이후 식단을 정상화했다가 다시 노출될 때 장 줄기세포에 어떤 변화가 일어나는지 보입니다.","current":0,"steps":[{"title":"고지방 식단 노출","body":"생쥐에게 24주 동안 고지방 사료를 먹이자 체중이 늘고 장 줄기세포 수와 증식이 활발해졌으며, DNA와 단백질이 이루는 염색질 구조도 광범위하게 변했다.","facts":["F2","F3","F4"],"figure":{"label":"식단 투여 기간","value":{"v":24,"fact":"F2"},"unit":"주"}},{"title":"저지방 식단으로 전환","body":"식단을 저지방 사료로 바꾸자 4주 뒤에는 장 줄기세포의 기능적 특성과 종양 병변 크기가 일반 식단 대조군 수준에 가까워졌다.","facts":["F5"],"figure":{"label":"정상화 기간","value":{"v":4,"fact":"F5"},"unit":"주"}},{"title":"세포에 남은 장기적 흔적","body":"겉으로 보이는 기능은 회복됐지만, 고지방 식단으로 접근성이 높아졌던 염색질 영역 중 약 18%는 일반 사료로 바꾼 지 4주가 지나도 그 상태를 유지했다.","facts":["F6"],"figure":{"label":"변화가 남은 염색질 영역","value":{"v":18,"fact":"F6"},"unit":"%"}},{"title":"고지방 재노출과 종양 촉진","body":"다시 고지방 식단에 노출된 생쥐의 장 줄기세포는 처음 고지방 식단을 먹은 생쥐보다 오가노이드를 더 잘 형성하고 장 선종도 더 크게 자랐다. 다만 생쥐 소장 실험이므로 사람에게 그대로 적용할 수는 없다.","facts":["F7","F8","F9"]}]}},"sources":[{"source":"Wow TV","title":"[건강포커스] \"고지방 식단, 장 줄기세포에 흔적 남겨 종양 성장 촉진할 수도\"","url":"https://www.wowtv.co.kr/NewsCenter/News/Read?articleId=AKR20261112099100017","dateTime":"2026-11-12T20:16:37Z"}]},{"cid":"C75","kind":"personal","topic":"취업","asOf":"2026-11-10","story":{"title":"AI 시대, 기업이 진짜 원하는 인재는 '사람다움'","lede":{"text":"취준생 77.0%가 AI 활용 능력을 중요하게 보지만, 정작 신입 채용에서 이를 중시하는 기업은 39.0%에 그쳤다. 전문가들은 AI 시대에 오히려 '인간다움'과 협업 능력이 핵심이라고 입을 모았다.","facts":["F1","F2","F5"],"verdict":"ok"},"why": it":"%"},{"id":"F2","text":"한국경제인협회의 인식조사에서 기업 중 신입사원 선발 때 AI 활용 능력을 중요하게 여긴다는 응답은 39.0%에 그쳤다.","value":39,"unit":"%"},{"id":"F3","text":"문화일보가 지난 10일 서울 중구 새문안로 문화일보 사옥에서 AI 시대 인재상을 주제로 좌담회를 열었다."},{"id":"F4","text":"좌담회에는 조준모 성균관대 경제학과 교수, 정혜련 유앤파트너즈 인재검증 부문 하이어베스트 대표, 문선경 유니코써치 전무, 임희정 리멤버 헤드헌팅 그룹 브리스캔영 AI Tech 부문장이 참가했다."},{"id":"F5","text":"채용 관련 전문가들은 AI 시대의 인재상으로 오히려 '인간다움'을 꼽았다."},{"id":"F6","text":"정혜련 대표는 기업들이 '잡 딜'에서 리더십, 공감, 경청 같은 협업 능력을 중점적으로 요구하며 사람다움과 같이 일하고 싶은 매력이 필요하다고 말했다."},{"id":"F7","text":"문선경 전무는 이제 문제해결능력은 AI가 하게 됐으며 정직성과 윤리의식이 굉장히 중요하게 됐다고 말했다."},{"id":"F8","text":"임희정 전무는 업무 인원 축소로 재배치가 이뤄지면서 상황을 주도하고 재배치 시 잘 적응하며 변화에 잘 대응하는 사람을 원하고 있다고 말했다."},{"id":"F9","text":"맥킨지 보고서는 우리 기업의 1%만이 AI를 툴로서 활용하는 것을 잘하며 AI가 안착하는 기업은 1%밖에 안 된다고 분석했다.","value":1,"unit":"%"},{"id":"F10","text":"문선경 전무는 현재 기업들이 '10년 이상 경험의 깊이'에다 AI 활용 능력이라는 두 번째 획이 들어간 '파이(π)형' 인재를 요구하고 있다고 말했다."},{"id":"F11","text":"임희정 전무는 기술은 입장권이고 AI 학습 능력과 소프트스킬이 경쟁력이며 기업은 채용공고에 어떤 업무에 AI를 어떻게 적용할 사람이 필요한지 구체적으로 밝혀야 한다고 말했다."}],"source":{"label":"문화일보 보도","asOf":"2026-11-10"},"spec":{"title":"AI 활용 능력, 누가 얼마나 중요하게 볼까","guide":"대상을 바꿔 보세요. 취업준비생과 기업이 신입 채용에서 AI 활용 능력을 얼마나 중요하게 보는지 차이를 알 수 있습니다.","baseline":"company","options":[{"key":"job_seeker","label":"취업준비생"},{"key":"company","label":"기업"}],"metrics":[{"key":"ai_importance","label":"AI 활용 능력 중시 비율","unit":"%","values":{"job_seeker":{"v":77,"fact":"F1"},"company":{"v":39,"fact":"F2"}}}]}},"sources":[{"source":"문화일보","title":"AI는 기본기, 인간다움이 필살기... 변화적응·협업이 승부 가른다\"[창간 35주년 특집]","url":"https://www.munhwa.com/article/11631054","dateTime":"2026-11-13T01:01:41Z"}]}],"emptyReason":null};

function icon(name,klass=''){return `<svg class="icon ${klass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.info}</svg>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const state={index:-1,depth:'short',step:{},viewpoint:'job_seeker',skill:0,answers:{},copy:false,theme:'light',saved:new Set()};

function toast(t){let box=document.getElementById('toast');box.textContent=t;box.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>box.classList.remove('show'),2000)}
function targetHash(i){return i<0?'#home':'#'+ITEMS[i].cid}
function navigate(i){window.location.hash=targetHash(i);if(window.location.hash===targetHash(i)){state.index=i;render();window.scrollTo({top:0,behavior:'instant'})}}
function currentFromHash(){const h=decodeURIComponent(location.hash.replace('#',''));const i=ITEMS.findIndex(x=>x.cid===h);return i}
function setTheme(){document.documentElement.dataset.theme=state.theme;document.getElementById('themeToggle').innerHTML=icon(state.theme==='light'?'moon':'sun');document.getElementById('themeToggle').setAttribute('aria-label',state.theme==='light'?'다크 모드로 전환':'라이트 모드로 전환')}
function smallBadge(x){let m=INFO[x.cid];return `<span class="category ${m.tone}">${icon(m.icon,'icon-sm')}${esc(m.topic)}</span>`}
function miniViz(i){if(i===0)return '<div class="card-viz" aria-hidden="true"><span class="tiny-bar" style="height:16px"></span><span class="tiny-bar" style="height:30px"></span><span class="tiny-bar" style="height:47px"></span><span class="tiny-bar" style="height:56px"></span></div>';if(i===1)return '<div class="card-viz viz-dots" aria-hidden="true">'+Array.from({length:13},(_,j)=>'<span style="opacity:'+(j<3?1:.16)+'"></span>').join('')+'</div>';return '<div class="card-viz viz-line" aria-hidden="true"><b></b><i></i><b></b><i></i><b></b></div>'}
function overview(){return `<div class="shell"><section class="hero"><div><div class="today-label"><i></i><span>YOUR DAILY SIGNAL · ${dateStamp}</span></div><h1 class="serif">복잡한 세상,<br><em>이해는 선명하게.</em></h1><p>뉴스를 그냥 읽고 지나치지 마세요. 한눈에 요점을 잡고, 직접 눌러보고, 숫자 뒤에 숨은 맥락까지 확인하는 새로운 뉴스 읽기.</p></div><div class="hero-collage" aria-hidden="true"><div class="collage-circle"></div><div class="collage-card cc-ai"><span class="squareicon ai-color">${icon('dna')}</span><span class="micro">GENOME AI</span><strong>16 → 30%</strong></div><div class="collage-card cc-health"><span class="squareicon health-color">${icon('heart-pulse')}</span><span class="micro">CELL MEMORY</span><strong>18%</strong></div><div class="collage-card cc-job"><span class="squareicon work-color">${icon('users')}</span><span class="micro">AI & WORK</span><strong>38%p</strong></div></div></section><section aria-labelledby="h-stories"><div class="section-heading"><h2 id="h-stories">오늘의 세 가지 이야기 <span class="muted">/ 03</span></h2><p>관심 있는 이야기부터 골라보세요.</p></div><div class="articles-grid">${ITEMS.map((x,i)=>{let m=INFO[x.cid];return `<button class="story-card" data-open="${i}" style="--theme-color:var(--${m.tone})" aria-label="${esc(x.story.title)} 읽기"><div class="card-head">${smallBadge(x)}<span class="muted kicker">0${i+1}</span></div><h3>${esc(x.story.title)}</h3><p>${esc(m.compact)}</p>${miniViz(i)}<div class="card-metric"><span class="big" style="color:var(--theme-color)">${m.metric}</span><span class="text">${esc(m.metricSub)}</span></div><span class="card-arrow">${icon('arrow-right','icon-sm')}</span></button>`}).join('')}</div></section><section class="howto" aria-label="이 시안을 읽는 방법"><span>${icon('book-open')}핵심 확인</span>${icon('arrow-right','arrow icon-sm')}<span>${icon('mouse-pointer')}직접 조작</span>${icon('arrow-right','arrow icon-sm')}<span>${icon('shield-check')}출처 점검</span></section></div>`}

function stepWorkbench(x){let m=INFO[x.cid],spec=x.widget.spec,k=state.step[x.cid]||0,st=spec.steps[k];let steps=['데이터·관찰','변화·회복','핵심 차이','향후·재노출'];if(m.tone==='health')steps=['24주 노출','4주 전환','18% 흔적','재노출'];if(m.tone==='ai')steps=['학습','예측','검증·활용','미래'];let figure=st.figure?`<div class="step-figure">${icon(k===2?'activity':m.icon)}<div><strong>${Number(st.figure.value.v).toLocaleString('ko-KR')}${esc(st.figure.unit)}</strong><small>${esc(st.figure.label)} · 보도 수치</small></div></div>`:`<div class="step-figure">${icon('sparkles')}<div><strong>전망</strong><small>확정된 결과가 아닌 향후 가능성</small></div></div>`;let special=m.tone==='health'?`<div class="research-warning">${icon('info','icon-sm')}<span>연구 대상은 <b>생쥐</b>입니다. 세포 변화의 18%는 사람의 질병 발생률이 아닙니다.</span></div>`:'';return `<div class="workbench" style="--hero-accent:var(--${m.tone});--hero-soft:var(--${m.tone}-soft)"><div class="step-track">${spec.steps.map((v,i)=>`<button class="step-btn" data-step="${i}" aria-pressed="${i===k}"><span class="stepnum">0${i+1} / 04</span><span class="stepname">${esc(steps[i])}</span></button>`).join('')}</div><div class="step-content"><div><h3>${esc(st.title)}</h3><p>${esc(st.body)}</p></div>${figure}</div><div class="step-nav"><span>${k+1} / ${spec.steps.length} 단계 · 직접 눌러 탐색</span><div class="step-buttons"><button class="solidbtn previousbtn" data-step="${k-1}" ${k===0?'disabled':''}>${icon('arrow-left','icon-sm')} 이전</button><button class="solidbtn" data-step="${k+1}" ${k===spec.steps.length-1?'disabled':''}>다음 ${icon('arrow-right','icon-sm')}</button></div></div>${m.tone==='health'?`<div style="margin-top:20px" class="health-arc"><div class="donut" role="img" aria-label="염색질 변화 유지 비율 약 18퍼센트"><div class="ins"><strong>18%</strong><span>유지된 영역</span></div></div><div class="health-note"><strong>겉으로 회복돼도 남은 흔적</strong><p>고지방 식단으로 접근성이 높아졌던 염색질 영역 가운데 약 18%가 식단 변경 4주 뒤에도 유지됐다는 뜻입니다.</p></div></div>`:''}${special}<p class="demo-caption">${esc(spec.guide)} · 모든 단계의 수치는 원본 파일에 연결된 보도 자료를 기반으로 표시됩니다.</p></div>`}
function hiringWorkbench(x){let m=INFO[x.cid];let view=state.viewpoint;let set=[{key:'job_seeker',label:'취업준비생',value:77},{key:'company',label:'기업',value:39}];let details=view==='job_seeker'?'취업준비생 77%는 취업에서 AI 활용 능력이 중요하다고 답했어요.':'기업 응답 39%는 신입 채용에서 AI 활용 능력을 중시한다고 답했어요.';let skills=[['협업','함께 일할 사람의 입장을 듣고 일을 조율하는 능력'],['공감·경청','상대의 말과 상황을 이해하고 신뢰를 쌓는 태도'],['정직·윤리','AI 결과를 검토하고 책임 있게 판단하는 자세'],['전문성 + AI','한 분야의 깊이에 AI 활용 역량을 더하는 파이(π)형 인재']];return `<div class="workbench" style="--hero-accent:var(--work);--hero-soft:var(--work-soft)"><div class="compare-wrap">${set.map(a=>`<div class="metric-card ${view===a.key?'active':''}"><button data-view="${a.key}" aria-pressed="${view===a.key}"><span class="small">${a.label}</span><strong>${a.value}<small style="font-size:16px">%</small></strong><div class="meter"><i style="width:${a.value}%"></i></div><span style="font-size:11px;color:var(--muted);display:block;margin-top:10px">관점 바꾸기 ${icon('mouse-pointer','icon-sm')}</span></button></div>`).join('')}</div><div class="difference"><strong>38%p</strong><p>두 조사 응답 비율의 차이 · <b>77 − 39 = 38%p</b><br>같은 질문·동일 집단의 결과는 아니므로 해석에 주의하세요.</p></div><div class="perspective"><strong>${view==='job_seeker'?'취준생 관점':'기업 관점'}</strong> · ${details}</div><div class="section-line" style="margin:20px 0"></div><div style="font-weight:900;font-size:14px">기술 다음에 중요한 것은? <span class="muted" style="font-weight:500;font-size:12px">키워드를 눌러보세요</span></div><div class="skills">${skills.map((v,i)=>`<button class="skill" data-skill="${i}" aria-pressed="${state.skill===i}">${v[0]}</button>`).join('')}</div><p class="skill-explain">${esc(skills[state.skill][1])}</p><p class="demo-caption">비율은 한국경제인협회 관련 보도를 바탕으로 합니다. 역량 설명은 원문에 인용된 전문가 의견 및 개념 설명을 알기 쉽게 재구성했습니다.</p></div>`}
function blocks(x){return `<div class="text-blocks">${x.story.blocks.map(b=>`<section class="text-section ${esc(b.kind)}"><span class="text-kind">${({fact:'보도된 사실',concept:'개념 풀어보기',meaning:'해석과 시사점',background:'배경'})[b.kind]||'설명'}</span><h3>${esc(b.heading)}</h3><p>${b.sentences.map(v=>esc(v.text)).join(' ')}</p></section>`).join('')}</div>`}
function quiz(x){let q=INFO[x.cid].quiz,ans=state.answers[x.cid];return `<section class="quiz"><span class="quiz-kicker">CHECK YOUR UNDERSTANDING · 1 QUESTION</span><h2>${esc(q.question)}</h2><div class="quiz-options">${q.answers.map((a,i)=>`<button data-answer="${i}" aria-pressed="${ans===i}">${esc(a)}</button>`).join('')}</div>${ans!==undefined?`<div class="quiz-feedback"><b>${ans===q.correct?'✓ 맞았어요!':'↗ 한 번 더 살펴볼까요?'}</b>${esc(q.explain)}</div>`:''}</section>`}
function article(x,i){let m=INFO[x.cid],saved=state.saved.has(x.cid),detailed=state.depth==='long';return `<div class="shell article-layout">${sidebar()}<article class="article-column"><button class="back" id="articleBack">${icon('arrow-left','icon-sm')} 오늘의 세 가지 이야기</button><div class="story-meta">${smallBadge(x)}<span class="meta-divider"></span><span class="muted">기준 시점 ${esc(x.asOf)}</span><span class="meta-divider"></span><span class="muted">0${i+1} / 03</span></div><h1 class="article-title serif">${esc(x.story.title)}</h1><p class="lede">${esc(x.story.lede.text)}</p><div class="article-actions"><button class="actionbtn" id="bookmark" aria-pressed="${saved}">${icon(saved?'bookmark-check':'bookmark','icon-sm')}${saved?'저장됨':'나중에 읽기'}</button><button class="actionbtn" id="share">${icon('share-2','icon-sm')}핵심 요약 복사</button><div class="read-tabs" role="group" aria-label="읽기 모드"><button data-depth="short" aria-pressed="${!detailed}">30초 핵심</button><button data-depth="long" aria-pressed="${detailed}">깊이 읽기</button></div></div>${articleVisual(x)}<div class="why-panel"><strong>왜 지금 이 뉴스일까요?</strong><p>${esc(x.story.why.text)}</p></div><div class="section-line"></div><div class="explore-header"><div><span class="eyebrow" style="color:var(--${m.tone})">INTERACTIVE EXPLAINER</span><h2>직접 움직여 이해하기</h2></div><p>${m.tone==='work'?'응답을 눌러 관점 바꾸기':'단계를 눌러 흐름 따라가기'}</p></div><div id="workbench">${m.tone==='work'?hiringWorkbench(x):stepWorkbench(x)}</div>${detailed?`<div class="section-line"></div><section class="card-section" id="deepDive"><span class="eyebrow">GO DEEPER</span><h2>맥락까지 읽어보기</h2>${blocks(x)}</section>`:`<p style="color:var(--muted);font-size:12px;margin:17px 0">더 자세한 배경이 궁금하다면 위의 <b>‘깊이 읽기’</b>를 눌러보세요.</p>`}${quiz(x)}${x.story.terms.length?`<section class="card-section"><h2>낯선 단어, 10초 해설</h2><div class="glossary-grid">${x.story.terms.map(t=>`<details class="term"><summary>${esc(t.term)}${icon('chevron-down','icon-sm')}</summary><p>${esc(t.explain)}</p></details>`).join('')}</div></section>`:''}<section class="card-section"><h2>원문에서 확인하기 <span style="font-size:13px;color:var(--muted);font-weight:500">${x.sources.length}건</span></h2><ul class="source-list">${x.sources.map(src=>`<li><a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer"><span><strong>${esc(src.source)}</strong><small>${esc(src.title)} · ${sourceDate(src.dateTime)}</small></span>${icon('external-link','icon-sm')}</a></li>`).join('')}</ul><p class="source-disclaimer">사실과 수치는 업로드된 HTML의 보도 내용을 재구성했습니다. '개념 풀어보기'와 '해석'은 보도 사실 자체와 구분되며, 디자인 시안은 자료의 사실 여부를 추가 검증하지 않았습니다.</p></section><div class="article-next"><div>다음 이야기<strong>${esc(INFO[ITEMS[(i+1)%ITEMS.length].cid].topic)}</strong></div><button class="solidbtn" data-open="${(i+1)%ITEMS.length}">다음 기사 ${icon('arrow-right','icon-sm')}</button></div></article></div>`}
function render(){state.index=currentFromHash();app.innerHTML=state.index<0?overview():article(ITEMS[state.index],state.index);document.title=state.index<0?'오늘, 한눈에 — 인터랙티브 뉴스 리더 시안':ITEMS[state.index].story.title+' | 오늘, 한눈에';updateProgress();setTheme()}

function updateProgress(){const bar=document.getElementById('progress');if(state.index<0){bar.style.width='0%';return}let max=document.documentElement.scrollHeight-window.innerHeight;bar.style.width=Math.round(max>0?Math.min(100,window.scrollY/max*100):100)+'%'}
function summarize(x){let m=INFO[x.cid];return `${x.story.title}\n\n${x.story.lede.text}\n\n핵심:\n${m.facts.map(v=>'· '+v).join('\n')}\n\n출처: ${x.sources[0]?.source||'첨부 자료'} · 기준 ${x.asOf}\n원문: ${x.sources[0]?.url||''}\n※ 첨부 파일 기반 뉴스 리더 시안`}
async function copySummary(x){const txt=summarize(x);try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt)}else{const ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('failed')}toast('핵심 요약을 복사했어요')}catch(e){toast('복사가 허용되지 않는 환경이에요')}}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.open!==undefined){navigate(Number(btn.dataset.open));return}if(btn.id==='home'||btn.id==='allNews'||btn.id==='articleBack'){navigate(-1);return}if(btn.id==='themeToggle'){state.theme=state.theme==='light'?'dark':'light';setTheme();persist();return}if(state.index<0)return;const x=ITEMS[state.index];if(btn.id==='bookmark'){state.saved.has(x.cid)?state.saved.delete(x.cid):state.saved.add(x.cid);persist();render();toast(state.saved.has(x.cid)?'읽기 목록에 저장했어요':'저장을 해제했어요');return}if(btn.id==='share'){copySummary(x);return}if(btn.dataset.depth){if(state.depth!==btn.dataset.depth){let y=window.scrollY;state.depth=btn.dataset.depth;render();window.scrollTo({top:y,behavior:'instant'})}return}if(btn.dataset.step!==undefined){const next=Number(btn.dataset.step);if(next>=0&&next<x.widget.spec.steps.length){state.step[x.cid]=next;updateWorkbench()}return}if(btn.dataset.view){state.viewpoint=btn.dataset.view;updateWorkbench();return}if(btn.dataset.skill!==undefined){state.skill=Number(btn.dataset.skill);updateWorkbench();return}if(btn.dataset.answer!==undefined){state.answers[x.cid]=Number(btn.dataset.answer);render();const quizEl=document.querySelector('.quiz');quizEl?.scrollIntoView({block:'center',behavior:'smooth'})}});
window.addEventListener('hashchange',()=>{let before=state.index;render();if(state.index!==before)window.scrollTo({top:0,behavior:'instant'})});
window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);
render();
</script>
</body>
</html>
